version = "0.1.0"
description = "Extrator de itens de pregão SRP do SIASGnet-ATASRP (comprasnet)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.136.3",
    "httpx>=0.28.1",
    "beautifulsoup4>=4.14.3",
    "uvicorn>=0.49.0",
]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "mypy>=1.0",
]
